[workspace]
members = ["ashd", "cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Princeton Ace Lopez <princetonacelopez@gmail.com>"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# IDs
ulid = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
anyhow = "1"
thiserror = "2"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Crypto (audit log hash chaining)
sha2 = "0.10"
hex = "0.4"

# PTY
pty-process = "0.4"
nix = { version = "0.29", features = ["signal", "ptrace", "fs", "process", "user", "term"] }

# File watching / inotify
notify = "7"

# Glob matching
globset = "0.4"

# Config dirs
dirs = "5"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Process
libc = "0.2"

# Data
bytes = "1"
